services:
  - type: web
    name: paint-and-guess-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run prisma:migrate
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        value: https://paint-and-guess-frontend.onrender.com

  - type: web
    name: paint-and-guess-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paint-and-guess-backend.onrender.com
      - key: VITE_SOCKET_URL
        value: https://paint-and-guess-backend.onrender.com
