services:
  - type: web
    name: paint-and-guess-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate
    preDeployCommand: npm run prisma:migrate
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        value: file:/var/data/rooms.db
      - key: ROOMS_DATA_DIR
        value: /var/data
      - key: ALLOWED_ORIGINS
        value: https://paint-and-guess-frontend.onrender.com
    disk:
      name: room-db
      mountPath: /var/data
      sizeGB: 1

  - type: static
    name: paint-and-guess-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paint-and-guess-backend.onrender.com
      - key: VITE_SOCKET_URL
        value: https://paint-and-guess-backend.onrender.com

